plugins {
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
}

base {
	archivesName = 'roadweaver-neoforge'
}

repositories {
	maven { url = 'https://maven.shedaniel.me/' }
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			gameDirectory = project.file('run-client')
		}
		server {
			server()
			gameDirectory = project.file('run')
			programArgument '--nogui'
		}
	}

	mods {
		roadweaver {
			sourceSet(sourceSets.main)
		}
	}

	// Unit tests use Minecraft classes (BlockPos, Identifier and so on)
	unitTest {
		enable()
		testedMod = mods.roadweaver
	}
}

dependencies {
	// Config screen, used on the client only; bundled so players need no extra download
	jarJar(implementation("me.shedaniel.cloth:cloth-config-neoforge")) {
		version {
			strictly "[${project.cloth_config_version},)"
			prefer project.cloth_config_version
		}
	}

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def templateProps = [
	version          : project.version,
	minecraft_version: project.minecraft_version,
	neo_version      : project.neo_version,
	java_version     : project.java_version,
	cloth_config_version: project.cloth_config_version,
]

tasks.withType(ProcessResources).configureEach {
	inputs.properties templateProps
	filesMatching(["META-INF/neoforge.mods.toml", "*.mixins.json"]) {
		expand templateProps
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = project.java_version as int
	it.options.compilerArgs += ['-Xmaxerrs', '10000']
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	// Template tests read src/main/resources from the project folder
	systemProperty 'roadweaver.projectDir', project.projectDir.absolutePath
	// StructureTemplateUpgradeTool only runs when asked: -Droadweaver.upgradeTemplates=true
	systemProperty 'roadweaver.upgradeTemplates', System.getProperty('roadweaver.upgradeTemplates', 'false')
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(project.java_version as int)
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "LICENSE_roadweaver" }
	}
	from("NOTICE") {
		rename { "NOTICE_roadweaver" }
	}
}
